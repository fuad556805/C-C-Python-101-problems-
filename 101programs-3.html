<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 Programs — Fahim's Programming Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --glass: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.9);
  --text: #1a1a2e;
  --muted: #6b7280;
  --subtle: #9ca3af;
  --sans: 'Nunito', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); min-height: 100vh; overflow-x: hidden; background: #eef2ff; color: var(--text); }

.bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.bg-canvas::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 10%, rgba(139,92,246,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 70% 70% at 90% 5%,  rgba(59,130,246,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 90%, rgba(236,72,153,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 80% 50% at 10% 90%, rgba(16,185,129,0.12) 0%, transparent 60%);
  background-color: #eef2ff;
  animation: bgShift 14s ease-in-out infinite alternate;
}
@keyframes bgShift { 0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(25deg);} }

.blob { position:fixed; border-radius:50%; filter:blur(80px); opacity:0.28; animation:blobFloat linear infinite; pointer-events:none; z-index:0; }
.blob1{width:500px;height:500px;background:radial-gradient(circle,#a78bfa,#6366f1);top:-120px;left:-150px;animation-duration:20s;}
.blob2{width:400px;height:400px;background:radial-gradient(circle,#f472b6,#fb923c);top:25%;right:-120px;animation-duration:26s;animation-delay:-8s;}
.blob3{width:380px;height:380px;background:radial-gradient(circle,#34d399,#06b6d4);bottom:8%;left:5%;animation-duration:22s;animation-delay:-4s;}
.blob4{width:320px;height:320px;background:radial-gradient(circle,#60a5fa,#818cf8);bottom:-80px;right:15%;animation-duration:18s;animation-delay:-12s;}
@keyframes blobFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1);}33%{transform:translateY(-28px) rotate(120deg) scale(1.04);}66%{transform:translateY(18px) rotate(240deg) scale(0.97);}}

header { position:relative; z-index:100; padding:48px 48px 36px; }
.header-inner { max-width:1200px; margin:0 auto; }
.header-glass {
  background:rgba(255,255,255,0.68);
  backdrop-filter:blur(40px) saturate(2);
  -webkit-backdrop-filter:blur(40px) saturate(2);
  border:1px solid rgba(255,255,255,0.95);
  border-radius:28px;
  padding:38px 48px;
  box-shadow:0 20px 60px rgba(139,92,246,0.10),0 4px 16px rgba(0,0,0,0.05),inset 0 1px 0 white;
  animation:slideDown .7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-28px);}to{opacity:1;transform:translateY(0);}}

.badge {
  display:inline-flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(59,130,246,.12));
  border:1px solid rgba(139,92,246,.3); border-radius:50px;
  padding:6px 16px; font-size:11px; font-weight:700; color:#7c3aed;
  letter-spacing:1.5px; text-transform:uppercase; margin-bottom:18px;
}
.badge-dot { width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#3b82f6); animation:pulse 2s infinite; box-shadow:0 0 8px rgba(139,92,246,0.5); }
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.75);opacity:.6;}}

h1 {
  font-size:clamp(2.6rem,5.5vw,4.6rem); font-weight:900; line-height:1; letter-spacing:-3px;
  background:linear-gradient(135deg,#1a1a2e 0%,#7c3aed 40%,#3b82f6 70%,#ec4899 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px;
}
.subtitle { color:var(--muted); font-size:14px; font-weight:500; letter-spacing:.5px; }

.stats-bar { display:flex; gap:20px; margin-top:28px; flex-wrap:wrap; }
.stat-pill {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.95);
  border-radius:16px; padding:10px 18px;
  box-shadow:0 4px 16px rgba(0,0,0,.05),inset 0 1px 0 white;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.stat-pill:nth-child(1){animation-delay:.1s;} .stat-pill:nth-child(2){animation-delay:.2s;} .stat-pill:nth-child(3){animation-delay:.3s;}
@keyframes popIn{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
.stat-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.stat-icon.purple{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(139,92,246,.25));}
.stat-icon.blue{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(59,130,246,.25));}
.stat-icon.pink{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(236,72,153,.25));}
.stat-num{font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;}

.controls {
  position:relative; z-index:100; max-width:1200px; margin:20px auto; padding:0 48px;
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  animation:fadeUp .6s .3s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.search-wrap{flex:1;min-width:240px;position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:#8b5cf6;pointer-events:none;}
input[type="text"]{
  width:100%; background:rgba(255,255,255,.82); backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,255,255,.95); border-radius:13px;
  padding:13px 16px 13px 42px; color:var(--text);
  font-family:var(--sans); font-size:14px; font-weight:500; outline:none;
  box-shadow:0 4px 18px rgba(0,0,0,.05),inset 0 1px 0 white; transition:all .22s;
}
input[type="text"]:focus{border-color:rgba(139,92,246,.5);box-shadow:0 0 0 4px rgba(139,92,246,.1),0 4px 18px rgba(0,0,0,.05);background:rgba(255,255,255,.97);}
input[type="text"]::placeholder{color:#9ca3af;}

.filter-btns{display:flex;gap:7px;flex-wrap:wrap;}
.filter-btn{
  background:rgba(255,255,255,.72); backdrop-filter:blur(16px);
  border:1.5px solid rgba(255,255,255,.9); border-radius:10px;
  padding:9px 14px; color:var(--muted);
  font-family:var(--sans); font-size:11px; font-weight:700;
  cursor:pointer; transition:all .2s cubic-bezier(.34,1.56,.64,1);
  letter-spacing:.5px; text-transform:uppercase; white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.filter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(139,92,246,.14);border-color:rgba(139,92,246,.28);color:#7c3aed;background:rgba(255,255,255,.92);}
.filter-btn.active{background:linear-gradient(135deg,#7c3aed,#3b82f6);border-color:transparent;color:white;box-shadow:0 6px 18px rgba(124,58,237,.28);transform:translateY(-1px);}

.main{position:relative;z-index:10;max-width:1200px;margin:0 auto;padding:0 48px 80px;}
.category-section{margin-bottom:48px;}
.category-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1.5px solid rgba(255,255,255,.7);}
.cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 12px rgba(0,0,0,.07);}
.cat-title{font-size:.95rem;font-weight:800;color:var(--text);letter-spacing:1px;text-transform:uppercase;}
.cat-count{margin-left:auto;font-size:11px;font-weight:700;color:#7c3aed;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);border-radius:20px;padding:4px 12px;}

.questions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:13px;}

.q-card{
  background:rgba(255,255,255,.7); backdrop-filter:blur(32px) saturate(1.8);
  -webkit-backdrop-filter:blur(32px) saturate(1.8);
  border:1.5px solid rgba(255,255,255,.92); border-radius:20px;
  overflow:hidden; transition:all .28s cubic-bezier(.34,1.2,.64,1);
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.9);
  animation:cardIn .45s both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.q-card:hover{transform:translateY(-4px) scale(1.004);box-shadow:0 16px 44px rgba(124,58,237,.11),0 4px 14px rgba(0,0,0,.05),inset 0 1px 0 white;border-color:rgba(139,92,246,.28);}
.q-card.open{border-color:rgba(139,92,246,.35);box-shadow:0 18px 55px rgba(124,58,237,.13),inset 0 1px 0 white;}

.q-header{display:flex;align-items:flex-start;gap:11px;padding:16px;}
.q-num{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:11px;font-weight:800;color:white;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.14);}
.q-title{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--text);flex:1;}
.toggle-icon{flex-shrink:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:rgba(139,92,246,.1);color:#7c3aed;font-size:12px;font-weight:700;transition:all .28s cubic-bezier(.34,1.56,.64,1);}
.q-card.open .toggle-icon{transform:rotate(180deg);background:linear-gradient(135deg,#7c3aed,#3b82f6);color:white;box-shadow:0 4px 10px rgba(124,58,237,.28);}

.q-body{display:none;border-top:1.5px solid rgba(255,255,255,.7);}
.q-card.open .q-body{display:block;}

.io-section{padding:14px 16px;border-bottom:1.5px solid rgba(255,255,255,.7);display:flex;gap:12px;flex-wrap:wrap;}
.io-block{flex:1;min-width:110px;}
.io-label{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.io-label.inp{color:#f97316;} .io-label.out{color:#10b981;}
.io-label.inp::before{content:'';width:5px;height:5px;border-radius:50%;background:#f97316;box-shadow:0 0 6px #f97316;}
.io-label.out::before{content:'';width:5px;height:5px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;}
.io-value{background:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.9);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--text);box-shadow:inset 0 1px 0 white,0 2px 6px rgba(0,0,0,.03);}
.io-value.out-val{color:#059669;} .io-value.no-input{color:var(--subtle);font-style:italic;}

.solution-section{padding:14px 16px;}
.section-label{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;}
.lang-tabs{display:flex;gap:7px;margin-bottom:10px;}
.lang-tab{padding:6px 14px;border-radius:8px;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid rgba(0,0,0,.08);background:rgba(255,255,255,.5);color:var(--muted);transition:all .18s cubic-bezier(.34,1.4,.64,1);letter-spacing:.4px;}
.lang-tab:hover{transform:translateY(-1px);border-color:rgba(0,0,0,.14);color:var(--text);}
.lang-tab.c-tab.active{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:white;border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.3);}
.lang-tab.cpp-tab.active{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;border-color:transparent;box-shadow:0 4px 12px rgba(139,92,246,.3);}
.lang-tab.py-tab.active{background:linear-gradient(135deg,#f97316,#f59e0b);color:white;border-color:transparent;box-shadow:0 4px 12px rgba(249,115,22,.3);}

.code-panel{display:none;} .code-panel.active{display:block;}
pre{background:rgba(13,13,26,.9);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:14px 16px;font-family:var(--mono);font-size:11.5px;white-space:pre;overflow-x:auto;line-height:1.75;box-shadow:0 8px 28px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.04);}
pre.c-code{color:#7dd3fc;} pre.cpp-code{color:#d8b4fe;} pre.py-code{color:#fcd34d;}

/* Category colors */
.cat-basic .q-num{background:linear-gradient(135deg,#3b82f6,#06b6d4);}
.cat-pattern .q-num{background:linear-gradient(135deg,#8b5cf6,#ec4899);}
.cat-number .q-num{background:linear-gradient(135deg,#f97316,#f59e0b);}
.cat-array .q-num{background:linear-gradient(135deg,#10b981,#06b6d4);}
.cat-string .q-num{background:linear-gradient(135deg,#ec4899,#f97316);}
.cat-function .q-num{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
.cat-recursion .q-num{background:linear-gradient(135deg,#0ea5e9,#6366f1);}
.cat-structure .q-num{background:linear-gradient(135deg,#14b8a6,#10b981);}
.cat-file .q-num{background:linear-gradient(135deg,#f59e0b,#ef4444);}
.cat-advanced .q-num{background:linear-gradient(135deg,#6d28d9,#db2777);}

.cat-basic .cat-icon{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(6,182,212,.15));}
.cat-pattern .cat-icon{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(236,72,153,.15));}
.cat-number .cat-icon{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(245,158,11,.15));}
.cat-array .cat-icon{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(6,182,212,.15));}
.cat-string .cat-icon{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(249,115,22,.15));}
.cat-function .cat-icon{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.15));}
.cat-recursion .cat-icon{background:linear-gradient(135deg,rgba(14,165,233,.15),rgba(99,102,241,.15));}
.cat-structure .cat-icon{background:linear-gradient(135deg,rgba(20,184,166,.15),rgba(16,185,129,.15));}
.cat-file .cat-icon{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(239,68,68,.15));}
.cat-advanced .cat-icon{background:linear-gradient(135deg,rgba(109,40,217,.15),rgba(219,39,119,.15));}

.no-results{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;display:none;}

footer{position:relative;z-index:10;text-align:center;padding:28px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1px;border-top:1.5px solid rgba(255,255,255,.5);}

@media(max-width:640px){
  header,.controls,.main{padding-left:18px;padding-right:18px;}
  .header-glass{padding:26px 20px;} h1{font-size:2.2rem;letter-spacing:-2px;}
  .questions-grid{grid-template-columns:1fr;} .stats-bar{gap:8px;}
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.28);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.48);}
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="blob blob1"></div><div class="blob blob2"></div>
<div class="blob blob3"></div><div class="blob blob4"></div>

<header>
  <div class="header-inner">
    <div class="header-glass">
      <div class="badge"><div class="badge-dot"></div>Fahim's Programming Lab</div>
      <h1>101 Programs</h1>
      <p class="subtitle">Questions · Sample I/O · Beginner-Friendly Solutions in C, C++ &amp; Python</p>
      <div class="stats-bar">
        <div class="stat-pill"><div class="stat-icon purple">📚</div><div><div class="stat-num">101</div><div class="stat-label">Programs</div></div></div>
        <div class="stat-pill"><div class="stat-icon blue">⚡</div><div><div class="stat-num">3</div><div class="stat-label">Languages</div></div></div>
        <div class="stat-pill"><div class="stat-icon pink">🎯</div><div><div class="stat-num">10</div><div class="stat-label">Categories</div></div></div>
      </div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search programs… e.g. factorial, array, string, prime">
  </div>
  <div class="filter-btns">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="basic">Basic</button>
    <button class="filter-btn" data-cat="pattern">Pattern</button>
    <button class="filter-btn" data-cat="number">Number</button>
    <button class="filter-btn" data-cat="array">Array</button>
    <button class="filter-btn" data-cat="string">String</button>
    <button class="filter-btn" data-cat="function">Function</button>
    <button class="filter-btn" data-cat="recursion">Recursion</button>
    <button class="filter-btn" data-cat="structure">Structure</button>
    <button class="filter-btn" data-cat="file">File</button>
    <button class="filter-btn" data-cat="advanced">Advanced</button>
  </div>
</div>

<div class="main" id="mainContent"></div>
<div class="no-results" id="noResults">😕 No programs found. Try a different search!</div>

<footer>Made with ❤️ for Beginner Programmers — Fahim's Programming Lab</footer>

<script>
const programs = [
  // ─── BASIC (1–12) ───
  { id:1, cat:'basic', title:'Hello World',
    inp:'(none)', out:'Hello, World!',
    c:`#include <stdio.h>\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}`,
    py:`print("Hello, World!")` },

  { id:2, cat:'basic', title:'Print Your Name',
    inp:'(none)', out:'My name is Fahim',

    c:`#include <stdio.h>\nint main() {\n    printf("My name is Fahim\\n");\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    cout << "My name is Fahim" << endl;\n    return 0;\n}`,
    py:`print("My name is Fahim")` },

  { id:3, cat:'basic', title:'Sum of Two Numbers',
    inp:'5 3', out:'8',
    c:`#include <stdio.h>\nint main() {\n    int a, b;\n    scanf("%d %d", &a, &b);\n    printf("Sum = %d\\n", a + b);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << "Sum = " << a + b << endl;\n    return 0;\n}`,
    py:`a, b = map(int, input().split())\nprint("Sum =", a + b)` },

  { id:4, cat:'basic', title:'Subtract Two Numbers',
    inp:'10 4', out:'6',
    c:`#include <stdio.h>\nint main() {\n    int a, b;\n    scanf("%d %d", &a, &b);\n    printf("Result = %d\\n", a - b);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << "Result = " << a - b << endl;\n    return 0;\n}`,
    py:`a, b = map(int, input().split())\nprint("Result =", a - b)` },

  { id:5, cat:'basic', title:'Multiply Two Numbers',
    inp:'6 7', out:'42',
    c:`#include <stdio.h>\nint main() {\n    int a, b;\n    scanf("%d %d", &a, &b);\n    printf("Product = %d\\n", a * b);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << "Product = " << a * b << endl;\n    return 0;\n}`,
    py:`a, b = map(int, input().split())\nprint("Product =", a * b)` },

  { id:6, cat:'basic', title:'Divide Two Numbers',
    inp:'20 4', out:'5.00',
    c:`#include <stdio.h>\nint main() {\n    float a, b;\n    scanf("%f %f", &a, &b);\n    printf("Result = %.2f\\n", a / b);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    float a, b;\n    cin >> a >> b;\n    cout << "Result = " << a / b << endl;\n    return 0;\n}`,
    py:`a, b = float(input()), float(input())\nprint(f"Result = {a / b:.2f}")` },

  { id:7, cat:'basic', title:'Area of a Rectangle',
    inp:'5 3', out:'Area = 15',
    c:`#include <stdio.h>\nint main() {\n    int l, w;\n    scanf("%d %d", &l, &w);\n    printf("Area = %d\\n", l * w);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint main() {\n    int l, w;\n    cin >> l >> w;\n    cout << "Area = " << l * w << endl;\n    return 0;\n}`,
    py:`l, w = map(int, input().split())\nprint("Area =", l * w)` },

  { id:81, cat:'recursion', title:'Tower of Hanoi',

    c:`#include <stdio.h>\nvoid hanoi(int n,char from,char to,char aux){\n    if(n==0) return;\n    hanoi(n-1,from,aux,to);\n    printf("Move disk %d from %c to %c\\n",n,from,to);\n    hanoi(n-1,aux,to,from);\n}\nint main(){\n    int n; scanf("%d",&n);\n    hanoi(n,'A','C','B');\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nvoid hanoi(int n,char f,char t,char a){\n    if(n==0) return;\n    hanoi(n-1,f,a,t);\n    cout<<"Move disk "<<n<<" from "<<f<<" to "<<t<<endl;\n    hanoi(n-1,a,t,f);\n}\nint main(){\n    int n; cin>>n; hanoi(n,'A','C','B');\n    return 0;\n}`,
    py:`def hanoi(n, f, t, a):\n    if n == 0: return\n    hanoi(n-1, f, a, t)\n    print(f"Move disk {n} from {f} to {t}")\n    hanoi(n-1, a, t, f)\nhanoi(int(input()), 'A', 'C', 'B')` },

  { id:82, cat:'recursion', title:'Recursive Binary Search',
    inp:'5\n1 3 5 7 9\n7', out:'Found at index 3',
    c:`#include <stdio.h>\nint bSearch(int a[],int l,int r,int key){\n    if(l>r) return -1;\n    int m=(l+r)/2;\n    if(a[m]==key) return m;\n    if(a[m]<key) return bSearch(a,m+1,r,key);\n    return bSearch(a,l,m-1,key);\n}\nint main(){\n    int n,i; scanf("%d",&n);\n    int a[n]; for(i=0;i<n;i++) scanf("%d",&a[i]);\n    int key; scanf("%d",&key);\n    int r=bSearch(a,0,n-1,key);\n    if(r==-1) printf("Not Found\\n");\n    else printf("Found at index %d\\n",r);\n    return 0;\n}`,
    cpp:`#include <iostream>\nusing namespace std;\nint bSearch(int a[],int l,int r,int key){\n    if(l>r) return -1;\n    int m=(l+r)/2;\n    if(a[m]==key) return m;\n    if(a[m]<key) return bSearch(a,m+1,r,key);\n    return bSearch(a,l,m-1,key);\n}\nint main(){\n    int n; cin>>n;\n    int a[n]; for(int i=0;i<n;i++) cin>>a[i];\n    int key; cin>>key;\n    int r=bSearch(a,0,n-1,key);\n    cout<<(r==-1?"Not Found":"Found at index "+to_string(r))<<endl;\n    return 0;\n}`,
    py:`def b_search(a, l, r, key):\n    if l > r: return -1\n    m = (l+r)//2\n    if a[m] == key: return m\n    if a[m] < key: return b_search(a, m+1, r, key)\n    return b_search(a, l, m-1, key)\nn = int(input())\na = list(map(int,input().split()))\nkey = int(input())\nr = b_search(a, 0, n-1, key)\nprint("Not Found" if r==-1 else f"Found at index {r}")` },

function buildCard(p, delay) {
  const div = document.createElement('div');
  div.className = `q-card cat-${p.cat}`;
  div.style.animationDelay = `${delay}ms`;
  div.dataset.cat = p.cat;
  div.dataset.title = p.title.toLowerCase();
  div.innerHTML = `
    <div class="q-header" onclick="toggleCard(this.parentElement)">
      <div class="q-num">${p.id}</div>
      <div class="q-title">${p.title}</div>
      <div class="toggle-icon">▼</div>
    </div>
    <div class="q-body">
      <div class="io-section">
        <div class="io-block">
          <div class="io-label inp">Input</div>
          <div class="io-value ${p.inp==='(none)'?'no-input':''}">${p.inp.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="io-block">
          <div class="io-label out">Output</div>
          <div class="io-value out-val">${p.out.replace(/\n/g,'<br>')}</div>
        </div>
      </div>
      <div class="solution-section">
        <div class="section-label">💡 Solution</div>
        <div class="lang-tabs">
          <button class="lang-tab c-tab active" onclick="switchLang(this,'c-${p.id}')">C</button>
          <button class="lang-tab cpp-tab" onclick="switchLang(this,'cpp-${p.id}')">C++</button>
          <button class="lang-tab py-tab" onclick="switchLang(this,'py-${p.id}')">Python</button>
        </div>
        <div id="c-${p.id}" class="code-panel active"><pre class="c-code">${escHtml(p.c)}</pre></div>
        <div id="cpp-${p.id}" class="code-panel"><pre class="cpp-code">${escHtml(p.cpp)}</pre></div>
        <div id="py-${p.id}" class="code-panel"><pre class="py-code">${escHtml(p.py)}</pre></div>
      </div>
    </div>`;
  return div;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCard(card) {
  card.classList.toggle('open');
}

function switchLang(btn, panelId) {
  const section = btn.closest('.solution-section');
  section.querySelectorAll('.lang-tab').forEach(b => b.classList.remove('active'));
  section.querySelectorAll('.code-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(panelId).classList.add('active');
}

function render(filter='all', search='') {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  let total = 0;
  let delay = 0;

  categories.forEach(cat => {
    const items = programs.filter(p => {
      if (p.cat !== cat.key) return false;
      const catMatch = filter==='all' || p.cat===filter;
      const searchMatch = !search || p.title.toLowerCase().includes(search) || p.cat.includes(search) || String(p.id).includes(search);
      return catMatch && searchMatch;
    });

    if(items.length===0) return;
    total += items.length;

    const section = document.createElement('div');
    section.className = `category-section cat-${cat.key}`;
    section.innerHTML = `
      <div class="category-header">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-title">${cat.label}</div>
        <div class="cat-count">${items.length} programs</div>
      </div>
      <div class="questions-grid" id="grid-${cat.key}"></div>`;
    main.appendChild(section);

    const grid = document.getElementById(`grid-${cat.key}`);
    items.forEach((p, i) => {
      delay += 30;
      grid.appendChild(buildCard(p, Math.min(delay, 600)));
    });
  });

  document.getElementById('noResults').style.display = total===0 ? 'block' : 'none';
}

// Controls
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.cat, document.getElementById('searchInput').value.trim().toLowerCase());
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  const active = document.querySelector('.filter-btn.active')?.dataset.cat || 'all';
  render(active, e.target.value.trim().toLowerCase());
});

render();
</script>
